<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="globe" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#33435e"/>
      <stop offset="55%" stop-color="#131c2e"/>
      <stop offset="100%" stop-color="#070a11"/>
    </radialGradient>
    <clipPath id="globeClip">
      <circle cx="29" cy="29" r="21"/>
    </clipPath>
  </defs>

  <!-- globe -->
  <circle cx="29" cy="29" r="21" fill="url(#globe)" stroke="#f0c96b" stroke-width="2.5"/>
  <g clip-path="url(#globeClip)" stroke="#42527a" stroke-width="1.3" fill="none" opacity="0.85">
    <ellipse cx="29" cy="29" rx="8.5" ry="21"/>
    <ellipse cx="29" cy="29" rx="16.5" ry="21"/>
    <line x1="8" y1="29" x2="50" y2="29"/>
    <path d="M10 19 Q29 24 48 19" />
    <path d="M10 39 Q29 34 48 39" />
  </g>

  <!-- event sparks on the globe -->
  <circle cx="22" cy="20" r="2.4" fill="#ef4444"/>
  <circle cx="34" cy="33" r="2" fill="#a78bfa"/>
  <circle cx="24" cy="38" r="1.8" fill="#f0c96b"/>

  <!-- magnifying lens -->
  <circle cx="42" cy="42" r="12.5" fill="rgba(138,180,248,0.22)" stroke="#f0c96b" stroke-width="4"/>
  <line x1="51.5" y1="51.5" x2="59" y2="59" stroke="#f0c96b" stroke-width="5.5" stroke-linecap="round"/>
  <!-- lens glint -->
  <path d="M36 38 a8 8 0 0 1 5 -4" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>
</svg>
